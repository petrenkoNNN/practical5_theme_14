<html>
  <head>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <form class="film-form">
      <label>Название:<br />
        <input type="text" class="title" name="title" required />
      </label>
      <label>Жанр:<br />
        <input type="text" class="genre" name="genre" required />
      </label>
      <label>Год:<br />
        <input type="text" class="release-year" name="releaseYear" required />
      </label>
      <label>
        <input type="checkbox" class="is-watched" name="isWatched" /><br />
        Успели посмотреть?
      </label>

      <p class="error"></p>
      <button type="submit" class="submit-btn">Добавить</button>
      <button type="button" class="cancel-btn" hidden>Отменить редактирование</button>
    </form>
    <select class="sort-select">
      <option value="releaseYear">Год</option>
      <option value="title">Название</option>
      <option value="genre">Жанр</option>
    </select>
    <button type="button" class="sort-btn">Сортировать</button>
    <table class="film-table">
      <thead>
        <tr>
          <th>Название</th>
          <th>Жанр</th>
          <th>Год</th>
          <th>Успели посмотреть?</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody class="film-tbody">
        <!-- Rows will be inserted here -->
      </tbody>
    </table>
    <script src="script.js"></script>
  </body>
</html>
